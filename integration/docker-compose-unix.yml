services:
  unbound_exporter:
    build:
      context: ..
    user: root
    command: [ "-unbound.host=unix:///var/run/socket/unbound.ctl" ]
    volumes:
      - socket:/var/run/socket:ro
    ports:
      - "9167:9167"
    depends_on:
      unbound:
        condition: service_healthy

  unbound:
    build:
      context: .
      dockerfile: unbound.Containerfile
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/socket/unbound.ctl"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
    volumes:
      - socket:/var/run/socket:rw
    command: [ "/usr/local/sbin/unbound", "-v", "-d", "-c", "/etc/unbound/remote-control-unix.conf" ]
    ports:
      - "1053:1053/udp"
      - "1053:1053/tcp"
      - "2853:2853/tcp" # DoQ

volumes:
  socket:
