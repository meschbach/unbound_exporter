name: Build and release
on:
  # Runs automatically when a tag beginning with 'v' (i.e. a versioned release) is pushed.
  push:
    tags:
      - v*
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: build amd64 binary
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o unbound_exporter-linux-amd64 .

      - name: build arm64 binary
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o unbound_exporter-linux-arm64 .

      - name: copy binary for deb packaging
        run: cp unbound_exporter-linux-amd64 unbound_exporter

      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.15.1

      - name: build deb
        run: nfpm package -p deb -t unbound_exporter.deb

      - name: upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            unbound_exporter.deb
            unbound_exporter-linux-amd64
            unbound_exporter-linux-arm64

  push-release:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-artifacts

      - name: rename deb for release
        run: mv unbound_exporter.deb unbound_exporter-${GITHUB_REF_NAME}.x86_64.deb

      - name: push GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" unbound_exporter-${GITHUB_REF_NAME}.x86_64.deb unbound_exporter-linux-amd64 unbound_exporter-linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
